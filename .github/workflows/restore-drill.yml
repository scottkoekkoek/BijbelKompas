name: Herstelproef productie

# BK-007 / AT-16. Monthly: fresh dump of production, restored into a throw-away local
# Supabase stack inside this runner, then verified. The dump is never uploaded or kept.
# Production is only read, never written.
on:
  schedule:
    - cron: "41 4 1 * *" # 1st of every month, 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @bk/database
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Dump maken (alleen lezen)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OUT_DIR: ${{ runner.temp }}/drill
          NO_ENCRYPT: "1"
        run: scripts/backup.sh
      - name: Terugzetten op schone database en controleren
        run: scripts/restore-drill.sh "$(ls -d ${{ runner.temp }}/drill/bijbelkompas-*)"
